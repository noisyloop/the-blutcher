name: macOS Builds
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: blucher-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile engine with sanitizers
        run: g++ -std=c++17 -Wall -Wextra -pedantic -fsanitize=address,undefined -g tests/EngineTests.cpp -ISource -o engine-tests
      - run: ./engine-tests
      - name: Compile spectral tests with sanitizers
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic -fsanitize=address,undefined -g tests/SpectralTests.cpp -ISource -o spectral-tests
      - run: ./spectral-tests
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore incremental CMake build cache
        uses: actions/cache@v4
        with:
          path: build
          key: blucher-macos15-xcode-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            blucher-macos15-xcode-v1-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure universal build
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Bundle deliverables
        shell: bash
        run: |
          mkdir -p dist
          cp -R 'build/TheBlucher_artefacts/Release/VST3/The Blucher.vst3' dist/
          cp -R 'build/TheBlucher_artefacts/Release/AU/The Blucher.component' dist/
          cp -R 'build/TheBlucher_artefacts/Release/Standalone/The Blucher.app' dist/
          cp install-macos.command dist/Install-The-Blucher.command
          cp README.md dist/README.md
          chmod +x dist/Install-The-Blucher.command
          for bundle in 'The Blucher.vst3' 'The Blucher.component' 'The Blucher.app'; do
            codesign --force --deep --sign - "dist/$bundle"
            codesign --verify --deep --strict "dist/$bundle"
          done
          hdiutil create -volname 'The Blucher' -srcfolder dist -ov -format UDZO The-Blucher-macOS.dmg
      - name: Preserve incremental build after test failures
        if: always() && !cancelled() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: blucher-macos15-xcode-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: The-Blucher-macOS
          path: |
            The-Blucher-macOS.dmg
            dist/
